version: "3.8"

services:
  app:
    command: ["python", "-m", "waitress", "--host=0.0.0.0", "--port=5000", "--call", "app.web:create_app"]
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:-changeme_in_production}" --bind 0.0.0.0
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  celery-worker:
    build: .
    command: celery -A app.celery_app:celery_app worker -l info -Q fortis_monitor --pool=solo
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - redis
    restart: unless-stopped

  celery-beat:
    build: .
    command: celery -A app.celery_app:celery_app beat -l info
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-changeme_in_production}@redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
